name: Build Release Zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          mkdir -p build/kwwd-simple-series-for-wp

          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='build' \
                    --exclude='node_modules' \
                    --exclude='.gitattributes' \
                    ./ build/kwwd-simple-series-for-wp/

          cd build
          zip -r ../kwwd-simple-series-for-wp.zip kwwd-simple-series-for-wp

      - name: Attach zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: kwwd-simple-series-for-wp.zip